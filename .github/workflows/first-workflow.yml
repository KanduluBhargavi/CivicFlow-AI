# This workflow will be displayed as 'My First Push Workflow' in the Actions tab.
name: My First Push Workflow

# The 'on' keyword specifies the events that trigger this workflow.
# We want this workflow to run whenever code is pushed to the 'main' branch.
on:
  push:
    branches:
      - main

# The 'jobs' keyword defines the jobs that make up the workflow.
jobs:
  # 'say-hello' is the unique identifier for our job.
  say-hello:
    # 'runs-on' specifies the runner environment. 'ubuntu-latest' uses GitHub's hosted Ubuntu runner.
    runs-on: ubuntu-latest

# 'steps' is a sequence of tasks that will be executed in order within this job.
    steps:
      # Step 1: A descriptive name for this step.
      # 'run' executes a shell command on the runner.
      # We are simply echoing a message to the console.
      - name: Print a greeting message
        run: echo "Hello from my first GitHub Actions workflow!"

# Step 2: Another step to demonstrate sequential execution.
      # This step will run after the previous one completes successfully.
      - name: Print current time
        run: echo "The time is $(date)"