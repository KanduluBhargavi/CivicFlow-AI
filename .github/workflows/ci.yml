name: CivicFlow CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Check backend syntax
        run: python -m compileall -q backend/app backend/alembic
      - name: Check frontend JavaScript syntax
        shell: bash
        run: find frontend/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Department routing checks
        run: python backend/training/test_department_routing.py
      - name: Priority engine checks
        run: python backend/training/test_priority_engine.py
      - name: Role workflow regression
        run: python backend/tools/regression_check.py
