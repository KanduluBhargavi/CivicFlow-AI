<!DOCTYPE html>
<html lang="en">

<head>
<script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/civicflow-logo.svg">

    <title>CivicFlow AI | Login</title>

    <link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/product-v2.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/ui-consistency.css?v=20261009">
<link rel="stylesheet" href="css/civic-ui-r3.css?v=3">
</head>

<body>

    <div class="auth-container">

        <div class="left-panel">

            <div class="overlay"></div>

            <div class="left-content">

                <h1>Welcome Back</h1>

                <p>
                    Securely access CivicFlow AI to submit complaints,
                    track progress, and monitor public services across India.
                </p>

            </div>

        </div>

        <div class="right-panel">

            <form id="loginForm" autocomplete="off">

                <h2>Secure CivicFlow Login</h2>

                <div class="input-box">
                    <span class="field-icon" aria-hidden="true">✉</span>
                    <input
                        type="email"
                        id="email"
                        name="login_email"
                        placeholder="Email Address"
                        autocomplete="off"
                        required>
                </div>

                <div class="input-box">
                    <span class="field-icon" aria-hidden="true">🔒</span>
                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required>
                </div>

                <button type="submit">

                    Login

                </button>

                <p class="forgot-password-link">
                    <a href="forgot_password.html">Forgot Password?</a>
                </p>

                <p>

                    Don't have an account?

                    <a href="register.html">

                        Register

                    </a>

                </p>

            </form>

        </div>

    </div>

    <script src="js/api.js?v=20261021-api-routing-2"></script>
    <script src="js/auth.js"></script>
    <script>
window.addEventListener("pageshow", () => {
    setTimeout(() => {
        const loginForm = document.getElementById("loginForm");
        if (loginForm) loginForm.reset();
    }, 100);
});
</script>

</body>

</html>
