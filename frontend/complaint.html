<!DOCTYPE html>
<html lang="en">
<head>
    <script src="js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .location-btn {
            width: 100%;
            margin-bottom: 15px;
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 15px;
            height: 55px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: .3s;
        }
        .location-btn:hover {
            background: #0284c7;
        }
    </style>
</head>
<body>


    
<section id="complaintSection" >
    <button class="back-btn" onclick="goBack()">
    ← Back
</button>

<h2>Lodge Complaint</h2>

<form id="complaintForm" enctype="multipart/form-data">

<div class="input-box">
<input type="text" id="title" placeholder="Complaint Title" required>
</div>

<div class="input-box">
<textarea
id="description"
rows="5"
placeholder="Describe your complaint..."
required></textarea>
</div>

<div class="input-box">
<button type="button" id="locationBtn" class="location-btn">
📍 Use My Current Location
</button>
</div>

<div class="input-box">
<select id="state" required>
<option value="">Select State</option>
</select>
</div>

<div class="input-box">
<select id="district" required>
<option value="">Select District</option>
</select>
</div>

<div class="input-box">
<input type="text" id="area" placeholder="Area" required>
</div>

<div class="input-box">
<input type="text" id="landmark" placeholder="Landmark">
</div>

<div class="input-box">
<textarea
id="address"
rows="3"
placeholder="Address"
required></textarea>
</div>

<div class="input-box">
<input
type="text"
id="pincode"
placeholder="Pincode"
pattern="[0-9]{6}"
maxlength="6"
title="Enter a valid 6-digit pincode"
required>
</div>

<input type="hidden" id="latitude">
<input type="hidden" id="longitude">

<div class="input-box">

<label>Upload Image / Video</label>

<input
type="file"
id="media"
accept=".jpg,.jpeg,.png,.mp4,.mov,.avi">

</div>

<button type="submit">

Submit Complaint

</button>

</form>

</section>
<script src="js/api.js"></script>
<script src="js/location.js"></script>
<script src="js/geolocation.js"></script>
<script src="js/complaint.js"></script>

</body>

</html>
